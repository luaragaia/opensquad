    - main [ref=f16e173]:
      - main [ref=f16e174]:
        - heading "Nossa História" [level=1] [ref=f16e188]
        - generic [ref=f16e192]:
          - paragraph [ref=f16e195]: São 50 anos de paixão pela tinta, de orgulho e sensação de dever cumprido ao ver uma impressão bem feita, de se motivar diariamente com o som do maquinário rodando à todo vapor, mas…
          - generic [ref=f16e197]:
            - separator [ref=f16e198]
            - paragraph [ref=f16e199]: Nada se compara ao elogio de um cliente em ver seu sonho impresso em papel.
            - separator [ref=f16e200]
          - generic [ref=f16e202]:
            - paragraph [ref=f16e203]: Essa é a nossa maior motivação ao longo desses 50 anos no mercado de impressos em relevo. Sempre buscando inovações, implementação de novas tecnologias e métodos de impressão para poder ver o reflexo de nossos impressos no brilho dos olhos de nossos clientes.
            - paragraph [ref=f16e204]: "Abaixo você pode conferir um pouquinho da nossa história que continua sendo escrita diariamente:"
        - heading "1970" [level=2] [ref=f16e212]
        - paragraph [ref=f16e223]: Foi nessa pequena rua do bairro da Bela Vista (Rua Nestor Esteves Natividade, 106) onde tudo começou. O sonho de poder fazer impressos com uma qualidade superior foi o que motivou o pequeno empresário Luiz Vaiano a montar sua gráfica. E foi assim, que em Fevereiro de 1970 foi fundada a LUX Artes Gráficas Ltda.
        - heading "1975" [level=2] [ref=f16e231]
        - paragraph [ref=f16e242]: Em 1975, com o falecimento de seu fundador, a LUX passou a ser dirigida pelos seus 2 filhos, Luiz Vaiano Filho e Diva Thereza Vogler. Necessitando de mais espaço mudou-se para a Rua Santo Amaro, 524, também no bairro da Bela Vista.
        - heading "1977" [level=2] [ref=f16e250]
        - paragraph [ref=f16e261]: 2 anos depois, uma demanda crescente de clientes obrigou a LUX a se mudar novamente para uma sede maior na Av. Brigadeiro Luiz Antonio, 1502, onde se manteve pelos próximos 14 anos.
        - heading "1991" [level=2] [ref=f16e269]
        - paragraph [ref=f16e280]: Em 1991 a LUX se mudou pela última vez para sua atual sede (Rua Salvador Leme, 173/177) no bairro do Bom Retiro. Foi nessa época que entramos no mercado de impressos em relevo e nos consolidamos como a maior gráfica de impressos finos do Brasil.
        - heading "1997" [level=2] [ref=f16e288]
        - generic [ref=f16e296]:
          - img "Site LUX Relevo 1997" [ref=f16e301]
          - paragraph [ref=f16e304]: Ao ver o mundo da internet surgir bem a nossa frente resolvemos embarcar juntos nessa provável revolução. No ano de 1997 inauguramos nosso primeiro site. (detalhe para o telefone com apenas 3 dígitos)
        - heading "1998" [level=2] [ref=f16e312]
        - generic [ref=f16e320]:
          - paragraph [ref=f16e323]:
            - text: Nesse ano ganhamos o prêmio Fernando Pini de Excelência Gráfica na categoria Convites em Geral no Estado de São Paulo, pelo
            - link "convite Informix." [ref=f16e324] [cursor=pointer]:
              - /url: /impressos-para-eventos/convites/informix/
          - img "Prêmio Fernando Pini 1998" [ref=f16e329]
        - heading "2003" [level=2] [ref=f16e337]
        - generic [ref=f16e345]:
          - img "Prêmio Editora Abril LUX Relevo 2003" [ref=f16e350]
          - paragraph [ref=f16e353]: Por honrarmos todos os prazos e sempre oferecer um atendimento impecável fomos agraciados com o prêmio Passe Livre concedido pela Editora Abril aos seus melhores fornecedores, fato que se sucedeu no ano seguinte.
        - heading "2004" [level=2] [ref=f16e361]
        - generic [ref=f16e369]:
          - paragraph [ref=f16e372]: Nossa primeira grande reformulação on-line aconteceu em 2004, uma época em que os sites eram todos dinâmicos e animados. Nosso site foi desenvolvido com todos os recursos disponíveis na época, rendendo inúmeros elogios e confirmando que estavamos no caminho certo.
          - img "Site LUX Relevo 2004" [ref=f16e377]
        - heading "2008" [level=2] [ref=f16e385]
        - generic [ref=f16e393]:
          - img "Site LUX Relevo 2008" [ref=f16e398]
          - paragraph [ref=f16e401]: Neste ano, com a entrada de Leandro Vaiano, neto do fundador da empresa, no quadro societário, começamos nossos investimentos em tecnologia e nos tornamos a primeira gráfica a manter um catálogo completo e atualizado em nosso site, onde era possível solicitar orçamentos em apenas um clique e recebê-los prontamente em seu email.
        - heading "2013" [level=2] [ref=f16e409]
        - generic [ref=f16e417]:
          - paragraph [ref=f16e420]: Em 2013 desenvolvemos um site totalmente novo que oferecia uma experiência única em navegação e escolha de modelos, onde os orçamentos eram gerados imediatamente pelo próprio site sem a necessidade do envio por email.
          - img "Site LUX Relevo 2013" [ref=f16e425]
        - heading "2016" [level=2] [ref=f16e433]
        - generic [ref=f16e441]:
          - img "Site LUX Relevo 2016" [ref=f16e446]
          - paragraph [ref=f16e449]: Neste ano, inauguramos nosso primeiro e-commerce e desenvolvemos um layout totalmente responsivo, perfeito para o cenário de smartphones e tablets que já eram uma realidade.
        - heading "2017" [level=2] [ref=f16e457]
        - generic [ref=f16e465]:
          - paragraph [ref=f16e468]:
            - text: Inovando mais uma vez, desenvolvemos um sistema
            - strong [ref=f16e469]: ÚNICO E EXCLUSIVO
            - text: que proporciona aos noivos a opção de CRIAR SEUS CONVITES diretamente em nosso site, além de montar de acordo com sua preferência, nosso sistema gera o orçamento na hora facilitando ainda mais o processo para a compra de seus convites.
          - img "Site LUX Relevo Crie seu Convite 2017" [ref=f16e474]
        - heading "2018" [level=2] [ref=f16e482]
        - paragraph [ref=f16e493]: Em 2018 inauguramos nosso Show Room no Shopping dos Noivos, em parceria com a Maximu’s Rigor Trajes Finos para Noivos, situado em uma das avenidas mais nobres de São Paulo, na Avenida Rebouças, 2935 no bairro de Pinheiros.
        - heading "2019" [level=2] [ref=f16e501]
        - generic [ref=f16e509]:
          - img "Site LUX Relevo 2019" [ref=f16e514]
          - paragraph [ref=f16e517]: Neste ano, inauguramos nosso novo site, com um layout muito mais moderno e pensado 100% na experiência do usuário, tanto para Smatphones como Tablets e Desktop. Não tem como não se apaixonar por esse site que tem lançamentos maravilhosos toda semana e promoções incríveis todos os meses 😍
        - heading "2020" [level=2] [ref=f16e525]
        - paragraph [ref=f16e536]:
          - text: Em 2020 celebramos meio século de existência!!! É a comemoração das “Bodas de Ouro” de nossa gráfica familiar!!! Nesses 50 anos as coisas mudaram de uma forma incrível e surpreendente. Se quiser ver o que mudou nesse meio século, dá uma lida
          - link "nesse texto" [ref=f16e537] [cursor=pointer]:
            - /url: /promocao-50-anos
          - text: que você irá se surpreender também!!!
        - generic [ref=f16e545]:
          - paragraph [ref=f16e548]: Essa história está sendo escrita com a ajuda de algumas centenas de clientes corporativos e milhares de casais que nos escolheram como fornecedor. Obrigado a todos por fazerem parte da nossa história.
          - generic [ref=f16e550]:
            - separator [ref=f16e551]
            - paragraph [ref=f16e552]: Teremos orgulho em ter você como parte desta história, e poder participar da sua com impressos de alto padrão.
            - separator [ref=f16e553]
          - paragraph [ref=f16e556]: Gráfica LUX Relevo, há 50 anos imprimindo bom gosto e sofisticação nos melhores eventos, empresas e casamentos.
