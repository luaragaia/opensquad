<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:sans-serif;background:#F4EEF4;display:grid;grid-template-columns:1fr 1fr;gap:2px;}
.cell{display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:14px;}
.cell img{height:190px;}
.cell span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#888;}
.light{background:#fff;} .dark{background:#0A0A0A;}
</style></head><body>
<div class="cell light"><img src="BC rose -fundo claro-.svg"><span>rose claro (svg)</span></div>
<div class="cell dark"><img src="BC rose -fundo escuro-.svg"><span>rose escuro (svg)</span></div>
<div class="cell dark"><img src="BC branco.svg"><span>branco (svg)</span></div>
<div class="cell light"><img src="BC preto.svg"><span>preto (svg)</span></div>
</body></html>
